<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones: no pinch zoom or double-tap zoom, the page under the notch too (viewport-fit). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#101018" />
    <title>Mario Chicken Run</title>
    <style>html,body{background:#101018;height:100%;margin:0;overflow:hidden}body{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;justify-content:center;align-items:center;display:flex;position:fixed;inset:0}canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}</style>
    </head>
  <body>
    <canvas id="game"></canvas>
  <!-- Password gate, put into the built index.html by tools/publish_web.mjs. No art: the
     ripped files are inside pack.bin and nothing is readable before the password. -->
<style>
  #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #101018; color: #f8f8f8; font: 14px/1.6 "Courier New", monospace; z-index: 10; }
  #gate .box { width: min(340px, calc(100vw - 32px)); padding: 20px 22px; border: 4px solid #f8f8f8;
    box-shadow: 0 0 0 4px #101018, 0 0 0 8px #d82800; background: #181830; text-align: center; }
  #gate h1 { margin: 0 0 12px; font-size: 18px; letter-spacing: 2px; color: #f8d800; text-shadow: 2px 2px 0 #d82800; }
  #gate p { margin: 0 0 12px; }
  #gate input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; color: #101018;
    background: #f8f8f8; border: 2px solid #f8d800; outline: none; text-align: center; }
  #gate button { margin-top: 12px; padding: 6px 18px; font: inherit; font-weight: bold; color: #101018;
    background: #f8d800; border: 2px solid #f8f8f8; cursor: pointer; }
  #gate button:disabled { opacity: .5; cursor: default; }
  #gate .msg { min-height: 1.6em; margin: 10px 0 0; color: #a0a0c0; }
  #gate .msg.bad { color: #ff7060; }
  #forget { position: fixed; right: 6px; bottom: 4px; font: 11px "Courier New", monospace; color: #8080a0;
    opacity: .4; text-decoration: none; z-index: 11; display: none; }
  #forget:hover { opacity: 1; }
</style>
<div id="gate">
  <div class="box">
    <h1>MARIO CHICKEN RUN</h1>
    <form id="gate-form" hidden>
      <p>Private page. Type the password you were given.</p>
      <input type="password" id="gate-pw" autocomplete="current-password" autofocus aria-label="Password">
      <button type="submit" id="gate-go">PLAY</button>
    </form>
    <p class="msg" id="gate-msg">Loading...</p>
  </div>
</div>
<a href="#" id="forget" title="This browser forgets the password; the page asks again">forget password</a>
<script type="module" src="gate.js" data-entry="./assets/index-DrFOUnk2.js"></script>
</body>
</html>
